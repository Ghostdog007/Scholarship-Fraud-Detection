repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml, --ignore-missing-imports]
        additional_dependencies:
          - types-requests
          - numpy
        files: ^src/

  - repo: local
    hooks:
      - id: smoke-test
        name: Pipeline smoke test (2 epochs)
        entry: .venv/Scripts/python.exe main_v3.py --smoke
        language: system
        pass_filenames: false
        stages: [pre-push]
