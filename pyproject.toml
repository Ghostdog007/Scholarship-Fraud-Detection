[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # line too long — handled by formatter
    "F401",  # unused import — too noisy in __init__ files
]

[tool.ruff.lint.per-file-ignores]
"src/config_v3.py" = ["E741"]  # ambiguous variable name (N_FEATURES etc.)

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = true
strict_optional = false
exclude = [".venv", "docs", "outputs", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
