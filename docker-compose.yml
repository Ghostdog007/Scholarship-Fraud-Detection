# NIC Fraud Detection V3 — local dev stack (ADR-006 + ADR-010)
# Starts: Redis broker + FastAPI server + Celery worker + nginx front door
#
# Usage:
#   docker compose up --build          # full stack (UI on :8080, API on :8000)
#   docker compose up redis nic-api    # API only (no async training, no UI)
#
# Entry points:
#   http://localhost:8080/              Review console (nginx-served UI)
#   http://localhost:8080/docs          Swagger UI (proxied through nginx)
#   http://localhost:8000/health        API direct (bypasses nginx — debugging)
#
# The nginx service is the ONLY origin the browser needs. It mirrors the
# k8s deployment (deploy/k8s/nic-fraud.yaml), where an nginx pod plays the
# same role in front of the nic-api Service.

services:

  postgres:
    # System of record (V4-Scale step 0). Schema applied by `python -m src.db.migrate`.
    # Host port 5433 (not 5432): avoids colliding with a native/host-installed
    # PostgreSQL also using 5432 for local dev. Containers still reach this
    # service at postgres:5432 internally — only the host-side mapping moved.
    image: postgres:18
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=${NIC_DB_NAME:-nic_fraud}
      - POSTGRES_USER=${NIC_DB_USER:-nic_app}
      - POSTGRES_PASSWORD=${NIC_DB_PASSWORD:?set in .env}
    volumes:
      # postgres:18 image requires the mount at /var/lib/postgresql (not
      # .../data) — 18+ stores data in major-version-specific subdirectories
      # (pg_ctlcluster-compatible layout); mounting at .../data breaks startup.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NIC_DB_USER:-nic_app} -d ${NIC_DB_NAME:-nic_fraud}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db-init:
    # Runs once per `up`: schema migration + primary-batch ingest + JSON-store
    # replay, so Postgres is authoritative-with-real-data from the moment
    # nic-api/nic-worker start — not just an optional fallback target.
    # Idempotent (migrate is IF NOT EXISTS; ingest/replay upsert-or-replace),
    # so re-running on every `docker compose up` is safe and keeps Postgres
    # in sync with whatever is currently in data/ and outputs/.
    build: .
    command: python -m src.db.bootstrap
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./outputs:/app/outputs
    environment:
      - NIC_DB_HOST=postgres
      - NIC_DB_PORT=5432
      - NIC_DB_NAME=${NIC_DB_NAME:-nic_fraud}
      - NIC_DB_USER=${NIC_DB_USER:-nic_app}
      - NIC_DB_PASSWORD=${NIC_DB_PASSWORD:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  nic-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./outputs:/app/outputs
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - NIC_DB_HOST=postgres
      - NIC_DB_PORT=5432
      - NIC_DB_NAME=${NIC_DB_NAME:-nic_fraud}
      - NIC_DB_USER=${NIC_DB_USER:-nic_app}
      - NIC_DB_PASSWORD=${NIC_DB_PASSWORD:?set in .env}
      - NIC_READS_FROM_PG=1   # explicit: Postgres is the default read path, not opportunistic
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  nic-worker:
    build: .
    # concurrency=1 is MANDATORY — training writes to fixed output paths.
    # Never scale this service above 1 replica. See AGENTS.md hard stop #16.
    command: >
      celery -A src.api.tasks.celery_app worker
      --loglevel=info
      --concurrency=1
      -Q nic_fraud
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./outputs:/app/outputs
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - NIC_DB_HOST=postgres
      - NIC_DB_PORT=5432
      - NIC_DB_NAME=${NIC_DB_NAME:-nic_fraud}
      - NIC_DB_USER=${NIC_DB_USER:-nic_app}
      - NIC_DB_PASSWORD=${NIC_DB_PASSWORD:?set in .env}
      - NIC_READS_FROM_PG=1
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    deploy:
      replicas: 1   # NEVER increase — concurrent training corrupts fixed-path outputs

  nginx:
    # Front door: serves the frontend/ UI and reverse-proxies /v3, /health,
    # /ready, /docs to nic-api. Build context is the repo root so the image
    # can bake in frontend/. Same image/config used in k8s.
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      nic-api:
        condition: service_healthy

volumes:
  postgres-data:
