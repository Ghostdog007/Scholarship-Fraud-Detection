# nginx front door for the NIC Fraud Review Console.
#
# One origin for the browser: nginx serves the static frontend AND reverse-
# proxies the API. Because the upstream is the service name `nic-api`, this
# SAME config works unchanged in:
#   - docker compose  (service `nic-api`  -> Docker embedded DNS)
#   - kubernetes      (Service `nic-api`  -> kube-dns, same namespace)
# Keep the API service named `nic-api` in both and nothing here changes.

server {
    listen 80;
    server_name _;

    # Checkpoint uploads (.pth) can be tens of MB.
    client_max_body_size 512m;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Static frontend ----
    # Fall back to index.html only for navigation; missing assets still 404
    # naturally because they are matched here before the API locations only if
    # the path does not start with an API prefix (the regex locations below win
    # for those by nginx's longest-prefix / regex precedence).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API + interactive docs, proxied to FastAPI ----
    # evaluate-dataset rebuilds features+graph synchronously and can run for
    # minutes, so the read timeout is generous. Async training endpoints return
    # immediately (a job_id) and are polled, so they don't need it — but the
    # single timeout covers both.
    location ~ ^/(v3|health|ready|docs|redoc|openapi\.json) {
        proxy_pass http://nic-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}
